<form th:action=@{/resultado} method="get">

    <label for="nombre">Nombre:</label>

	<label for = "apellido">Apellido : </label>

<a th:href="@{'/resultado?nombre=' + ${nombreCodificado} + '&apellido=' + ${apellidoCodificado}}">
