<form th:action="@{resultado}" th:object="${animal}" method="post">
	<input type="hidden" th:field="*{dueño}">
	<input type="hidden" th:field="*{telefono}">
	<input type="hidden" th:field="*{nombre}">
	<input type="hidden" th:field="*{raza}">
	
	<label><input type="checkbox" th:field="*{servicio}" value="Vacunacion">Vacunacion</label><br>
	<label><input type="checkbox" th:field="*{servicio}" value="Peluqueria">Peluqueria</label><br>
	<label><input type="checkbox" th:field="*{servicio}" value="revision">Revision</label><br>
	<label><input type="checkbox" th:field="*{servicio}" value="desparasitacion">Desparasitacion</label><br>
	
	<p th:if="${#fields.hasErrors('servicio')}" th:errors="*{servicio}"></p>
	
	<label><input type="radio" th:field=*{urgencia} value="normal">Normal</label>
	<label><input type="radio" th:field="*{urgencia}" value="urgente">Urgente</label>
	
	<p th:if="${#fields.hasErrors('urgencia')}" th:errors="*{urgencia}"></p>
	
	<button type="submit">Enviar</button>	
		<button type="submit" th:formaction="@{/volver2}">Volver</button>
</form>
