<form th:action="@{/etapaFinal}" method="post">
	
	<h1>Introduce tu numero favorito</h1>
	<input type="number" name="numero">
		<button type="submit">Ir a etapa final </button>
	<input  name="nombre"  th:value = "${nombre}" hidden>
	<input  name="apellido" th:value = "${apellido}"hidden>
	<input name="color" th:value ="${color}" hidden >
	<input name="tecnologias" th:value ="${tech}" hidden>
	<div th:if="${error}" style="color: red; ">
	    <p th:text="${error}"></p>
	</div>
</form>
